<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저주받은 보물섬의 비밀 - 초등 영어 방탈출</title>
    <style>
        :root {
            --bg-color: #0b0714;
            --card-bg: rgba(23, 16, 38, 0.95);
            --accent-purple: #9d4edd;
            --accent-green: #52b788;
            --accent-red: #e63946;
            --accent-gold: #ffb703;
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(157, 78, 221, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(82, 183, 136, 0.1) 0%, transparent 40%);
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 880px;
            background: var(--card-bg);
            border: 2px solid var(--accent-purple);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(157, 78, 221, 0.35);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .title {
            font-size: 1.8rem;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #b8c0c8;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #2b1e4a;
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
            border: 1px solid var(--accent-purple);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-green));
            width: 0%;
            transition: width 0.4s ease;
        }

        .stage-badge {
            display: inline-block;
            background: var(--accent-purple);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* 🖼️ 그림 표시 영역 크기 및 비율 대폭 확대 */
        .scene-container {
            width: 100%;
            min-height: 350px;
            max-height: 480px;
            background: #000;
            border-radius: 12px;
            border: 2px solid rgba(157, 78, 221, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* 그림 잘림 방지 (contain 속성 적용) */
        .scene-container img {
            width: 100%;
            height: 100%;
            max-height: 480px;
            object-fit: contain;
            background-color: #05020a;
        }

        .story-box {
            background: rgba(0, 0, 0, 0.55);
            border-left: 4px solid var(--accent-gold);
            padding: 14px 18px;
            border-radius: 4px;
            margin-bottom: 18px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .question-title {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question-desc {
            font-size: 0.95rem;
            color: #a0aec0;
            margin-bottom: 18px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn-option {
            background: rgba(43, 30, 74, 0.85);
            border: 1.5px solid var(--accent-purple);
            color: white;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .btn-option:hover {
            background: var(--accent-purple);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(157, 78, 221, 0.4);
        }

        .hint-box {
            background: rgba(255, 183, 3, 0.12);
            border: 1px dashed var(--accent-gold);
            padding: 12px;
            border-radius: 8px;
            color: var(--accent-gold);
            font-size: 0.9rem;
            margin-bottom: 18px;
            display: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-hint {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-hint:hover {
            background: rgba(255, 183, 3, 0.2);
        }

        .feedback {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 12px;
            height: 28px;
        }

        .feedback.correct { color: var(--accent-green); }
        .feedback.wrong { color: var(--accent-red); }

        .screen-center {
            text-align: center;
            padding: 15px 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), #7b2cbf);
            color: white;
            border: none;
            padding: 15px 36px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.8);
        }

        .sound-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--accent-purple);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            z-index: 10;
        }

        /* 쏟아지는 보석 애니메이션 이펙트 */
        .gem-particle {
            position: fixed;
            top: -50px;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            z-index: 9999;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <button class="sound-btn" id="sound-toggle">🔊 음소거</button>

    <!-- 인트로 화면 -->
    <div id="intro-screen" class="screen-center">
        <h1 class="title">☠️ 저주받은 보물섬의 비밀</h1>
        <p class="subtitle" style="margin-top: 8px;">12개의 해골 봉인을 풀고 보물상자를 찾아 탈출하세요!</p>
        
        <div class="scene-container" style="margin: 20px 0;">
            <img src="intro.jpeg" alt="저주받은 보물섬 지도" id="intro-img">
        </div>

        <p style="color: #cbd5e0; line-height: 1.6; font-size: 0.98rem;">
            초등 영어 3~6학년 복습 퀴즈 게임입니다.<br>
            각 문장을 완성하고 결계를 하나씩 해제하세요!
        </p>

        <button class="btn-primary" id="btn-start">탈출 시작하기 🗝️</button>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="hidden">
        <div class="header">
            <span class="stage-badge" id="stage-badge">관문 1 / 12</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="scene-container">
            <img src="" id="scene-img" alt="문제 고화질 일러스트">
        </div>

        <div class="story-box" id="story-text"></div>

        <div class="question-title" id="question-text"></div>

        <div class="question-desc" id="question-desc"></div>

        <div class="options-grid" id="options-container"></div>

        <div class="hint-box" id="hint-box"></div>

        <div class="controls">
            <button class="btn-hint" id="btn-hint-toggle">💡 힌트 보기</button>
            <span style="font-size: 0.85rem; color: #a0aec0;">저주받은 보물섬 탈출</span>
        </div>

        <div class="feedback" id="feedback"></div>
    </div>

    <!-- 성공 엔딩 화면 (아웃트로 무비) -->
    <div id="ending-screen" class="screen-center hidden">
        <h1 class="title" style="color: var(--accent-green); font-size: 2.2rem; text-shadow: 0 0 20px rgba(82, 183, 136, 0.8);">🎉 무사히 탈출했습니다! 🎉</h1>
        <p class="subtitle" style="margin: 12px 0; font-size: 1.1rem; color: var(--accent-gold);">✨ 12개의 모든 해골 결제를 해제하고 보물상자가 열렸습니다! ✨</p>
        
        <div class="scene-container" style="margin: 20px 0; border-color: var(--accent-gold); box-shadow: 0 0 40px rgba(255, 183, 3, 0.6);">
            <img src="stage12.jpeg" alt="보물상자 오픈 무비">
        </div>

        <p style="color: #e2e8f0; font-size: 1.1rem; line-height: 1.6;">
            🏆 <b>축하합니다!</b> 훌륭한 영어 실력으로 보물섬의 쏟아지는 보석을 손에 넣었습니다!
        </p>

        <button class="btn-primary" onclick="location.reload()" style="background: linear-gradient(135deg, #ffb703, #fb8500); color: #000;">다시 도전하기 🔄</button>
    </div>
</div>

<script>
    // 오디오 합성 시스템 (Web Audio API)
    let audioCtx = null;
    let bgmOsc = null;
    let bgmGain = null;
    let isMuted = false;
    let isGameEnding = false;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBGM();
        }
    }

    // 으스스한 배경음악 (BGM)
    function startBGM() {
        if (!audioCtx || bgmOsc) return;

        bgmGain = audioCtx.createGain();
        bgmGain.gain.value = isMuted ? 0 : 0.05;
        bgmGain.connect(audioCtx.destination);

        const notes = [110, 116.54, 130.81, 123.47];
        let noteIndex = 0;

        function playSpookyNote() {
            if (isMuted || isGameEnding) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 1.5);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3.5);

            osc.connect(gain);
            gain.connect(bgmGain);

            osc.start();
            osc.stop(audioCtx.currentTime + 3.6);

            noteIndex = (noteIndex + 1) % notes.length;
        }

        setInterval(playSpookyNote, 3000);
        playSpookyNote();
    }

    // 자물쇠 딸깍(Unlock) 효과음 (SFX)
    function playLockSound() {
        if (!audioCtx || isMuted) return;

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(1200, now);
        osc1.frequency.exponentialRampToValueAtTime(400, now + 0.08);

        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);

        osc1.start(now);
        osc1.stop(now + 0.08);

        setTimeout(() => {
            const now2 = audioCtx.currentTime;
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(800, now2);
            osc2.frequency.exponentialRampToValueAtTime(1600, now2 + 0.12);

            gain2.gain.setValueAtTime(0.4, now2);
            gain2.gain.exponentialRampToValueAtTime(0.01, now2 + 0.15);

            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);

            osc2.start(now2);
            osc2.stop(now2 + 0.15);
        }, 90);
    }

    // 오답 시 으스스한 경고음
    function playWrongSound() {
        if (!audioCtx || isMuted) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.25);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.25);
    }

    // 🎉 엔딩 아웃트로 성공 팡파르 승리 음악
    function playVictoryFanfare() {
        if (!audioCtx || isMuted) return;
        isGameEnding = true;

        const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 523.25];
        const times = [0, 0.18, 0.36, 0.54, 0.75, 0.95];
        const durations = [0.15, 0.15, 0.15, 0.2, 0.18, 0.6];

        notes.forEach((freq, idx) => {
            const startTime = audioCtx.currentTime + times[idx];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.25, startTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + durations[idx]);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + durations[idx]);
        });
    }

    // 음소거 토글
    document.getElementById('sound-toggle').addEventListener('click', function() {
        isMuted = !isMuted;
        this.innerText = isMuted ? '🔇 음소거 됨' : '🔊 음소거';
        if (bgmGain) {
            bgmGain.gain.value = isMuted ? 0 : 0.05;
        }
    });

    const quizData = [
        {
            stage: 1,
            img: "stage1.jpeg",
            story: "🧙‍♂️ 저주받은 묘지 입구에서 꼬마 유령 소년이 막아서며 묻습니다: '내 가슴의 숫자가 보이는가? 나는 몇 학년일까?'",
            question: "What grade are you in?",
            desc: "질문: 너는 몇 학년이니? (유령 옷 표식: 6th)",
            options: [
                { text: "I'm in the fifth grade.", correct: false },

            ],
            hint: "유령의 옷에 '6th'라고 적혀 있어요. 6학년은 sixth 입니다!"
        },
        {

            story: "👻 유령 도서관의 책이 펼쳐지며 말합니다. '나는 5학년이고 매일 책을 읽어! 알맞은 표현을 맞춰봐!'",
            question: "I'm in the ( 1 ) grade. I ( 2 ) every day.",
            desc: "그림 힌트: 5th 표식 / 책 읽는 그림",
            options: [
                { text: "fifth / read books", correct: true },
                { text: "fourth / play the guitar", correct: false },
                { text: "fifth / play the guitar", correct: false },
                { text: "sixth / read books", correct: false }
            ],
            hint: "5학년은 fifth, 책을 읽는 것은 read books 입니다."
        },
        {
            stage: 3,
            img: "stage3.jpeg",
            story: "🌊 핏빛 바다속 해골이 튜브를 타고 떠오르며 묻습니다. '내가 수영을 즐기는 이 계절은 언제인가?'",
            question: "What season do you like?",
            desc: "질문: 너는 무슨 계절을 좋아하니? (그림: 수영하는 모습)",
            options: [
                { text: "I like winter.", correct: false },
                { text: "I like spring.", correct: false },
                { text: "I like summer.", correct: true },
                { text: "I like fall.", correct: false }
            ],
            hint: "수영을 즐기는 계절은 여름(summer)입니다."
        },
        {
            stage: 4,

            story: "🍂 붉은 단풍나무 숲길입니다. 단풍과 관련된 알맞은 단어를 선택하세요.",
            question: "I like ( 1 ). I can see ( 2 ).",
            desc: "그림: 붉게 물든 단풍나무 숲",
            options: [
                { text: "fall / colorful trees", correct: true },

            hint: "가을은 fall, 알록달록한 나무는 colorful trees 입니다."

        {

            question: "When is your birthday?",

        {

        {

        {

            question: "A: Why are you ( 1 )?  B: Because my dog is ( 2 ).",
            desc: "힌트: 슬픈 표정 / 넥카라를 한 아픈 강아지",
            options: [

        },
        {

            question: "Where is the bus stop?",
            desc: "질문: 버스 정류장은 어디에 있나요?",

            ],
            hint: "~옆에 있다는 표현은 'next to'를 사용합니다."
        },
        {
            stage: 10,
            img: "stage10.jpeg",
            story: "🧭 미로 경로 지도에서 은행(Bank)의 올바른 탈출 방향을 안내해주세요.",
            question: "A: Where is the bank?  B: Go straight one block and turn ( 1 ) at the restaurant. It's ( 2 ) the library.",
            desc: "길 안내: 식당에서 좌회전(left) 후 도서관 옆(next to) 위치",
            options: [
                { text: "left / next to", correct: true },
                { text: "right / under", correct: false },
                { text: "left / behind", correct: false },
                { text: "right / inside", correct: false }
            ],
            hint: "왼쪽 회전은 turn left, 옆은 next to 입니다."
        },
        {
            stage: 11,
            img: "stage11.jpeg",
            story: "🧔 콧수염 해적이 막아서며 묻습니다. '보물상자를 지키는 몬스터의 겉모습은 어떠한가?'",
            question: "What does he look like?",
            desc: "질문: 그는 어떻게 생겼나요? (그림: 콧수염 남자)",
            options: [
                { text: "He has a mustache.", correct: true },
                { text: "He has long red hair.", correct: false },
                { text: "He is wearing a dress.", correct: false },
                { text: "He has blue wings.", correct: false }
            ],
            hint: "콧수염을 가지고 있다는 표현은 'has a mustache' 입니다."
        },
        {
            stage: 12,
            img: "stage12.jpeg",
            story: "🔮 마지막 마녀가 보물상자를 막고 서 있습니다! 마녀의 인상착의 문장을 풀어 탈출하세요!",
            question: "She has ( 1 ) eyes and short black ( 2 ). She is wearing ( 3 ).",
            desc: "힌트: 초록색(green) 눈 / 검은 머리카락(hair) / 안경(glasses) 착용",
            options: [
                { text: "green / hair / glasses", correct: true },
                { text: "blue / hat / shoes", correct: false },
                { text: "red / hair / ring", correct: false },
                { text: "green / shoes / glasses", correct: false }
            ],
            hint: "초록 눈(green), 머리(hair), 안경(glasses) 순서입니다."
        }
    ];

    let currentStage = 0;

    document.getElementById('btn-start').addEventListener('click', function() {
        initAudio();
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadStage(0);
    });

    document.getElementById('btn-hint-toggle').addEventListener('click', function() {
        const hintBox = document.getElementById('hint-box');
        hintBox.style.display = hintBox.style.display === 'none' ? 'block' : 'none';
    });

    function loadStage(index) {
        currentStage = index;
        const data = quizData[index];

        document.getElementById('stage-badge').innerText = `관문 ${data.stage} / 12`;
        document.getElementById('progress-fill').style.width = `${(data.stage / 12) * 100}%`;
        document.getElementById('scene-img').src = data.img;
        document.getElementById('story-text').innerText = data.story;
        document.getElementById('question-text').innerText = data.question;
        document.getElementById('question-desc').innerText = data.desc;
        document.getElementById('hint-box').innerText = `💡 힌트: ${data.hint}`;
        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('feedback').innerText = '';

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt.text;
            btn.onclick = () => checkAnswer(opt.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect) {
        const feedback = document.getElementById('feedback');
        if (isCorrect) {
            playLockSound();
            feedback.className = 'feedback correct';
            feedback.innerText = '🔓 정답입니다! 자물쇠가 풀리며 다음 관문이 열립니다...';
            setTimeout(() => {
                if (currentStage + 1 < quizData.length) {
                    loadStage(currentStage + 1);
                } else {
                    showEnding();
                }
            }, 1200);
        } else {
            playWrongSound();
            feedback.className = 'feedback wrong';
            feedback.innerText = '☠️ 틀렸습니다! 다시 시도해 보세요.';
        }
    }

    // 💎 보석 쏟아지는 아웃트로 파티클 애니메이션 함수
    function startGemShower() {
        const gems = ['💎', '👑', '🪙', '✨', '🏆', '🎁', '🔮', '💰'];
        for (let i = 0; i < 70; i++) {
            setTimeout(() => {
                const gem = document.createElement('div');
                gem.className = 'gem-particle';
                gem.innerText = gems[Math.floor(Math.random() * gems.length)];
                gem.style.left = Math.random() * 95 + 'vw';
                gem.style.animationDuration = (Math.random() * 2 + 2) + 's';
                gem.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
                document.body.appendChild(gem);

                setTimeout(() => gem.remove(), 4000);
            }, i * 80);
        }
    }

    function showEnding() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('ending-screen').classList.remove('hidden');
        playVictoryFanfare();
        startGemShower();
    }
</script>
